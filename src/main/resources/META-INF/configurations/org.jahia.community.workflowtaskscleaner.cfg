# default configuration - won't be overridden

cronExpression=0 30 2 * * ?
# Ghost-workflow cleanup mode: false = report-only (default, never aborts); true = enforce abort of
# terminal-eligible ghost workflows. Report-only keeps the unattended scheduled job from silently
# aborting any workflow (see GhostWorkflowCleaner / U2 safety fix).
abortGhostWorkflows=false
